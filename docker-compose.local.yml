# Radar y sus dependencias para desarrollo local.
#
#   docker compose -f docker-compose.local.yml up -d --build --wait
#
# Los puertos se publican solo en 127.0.0.1. Se pueden cambiar con las variables de abajo.

name: foodly-radar

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - foodly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    networks:
      - foodly-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Se llama "radar" para que el comando sea «docker compose stop radar».
  radar:
    build:
      context: .
    image: foodly/radar-service:local
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RADAR_HOST_PORT:-8082}:8082"
    environment:
      SERVER_PORT: "8082"
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # La misma clave Base64 que usa IAM (JWT_SECRET_BASE64). Sin valor por defecto: se toma de .env o del
      # entorno (ver .env.example). Si falta, Radar no arranca; Redis y RabbitMQ sí.
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
      JWT_ISSUER: ${JWT_ISSUER:-foodly-iam}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-foodly-radar}
      BUSINESS_EVENTS_EXCHANGE: ${BUSINESS_EVENTS_EXCHANGE:-foodly.business}
      RADAR_H3_RESOLUTION: ${RADAR_H3_RESOLUTION:-9}
      RADAR_MAX_K_RING: ${RADAR_MAX_K_RING:-5}
    networks:
      - foodly-network
    restart: unless-stopped

networks:
  foodly-network:
    name: foodly-network
